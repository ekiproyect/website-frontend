  <body>
    <!-- Script inline para forzar scroll al inicio INMEDIATAMENTE -->
    <script>
      // Prevenir que el navegador restaure la posición de scroll
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      // Forzar scroll al inicio
      window.scrollTo(0, 0);
      // También al cargar el DOM
      document.addEventListener('DOMContentLoaded', function() {
        window.scrollTo(0, 0);
      });
      // Y cuando la página esté completamente cargada
      window.addEventListener('load', function() {
        window.scrollTo(0, 0);
      });
    </script>
    
    <!--
      Contenido estático de respaldo. React lo reemplaza al montar (createRoot
      limpia los hijos de #root). Sirve al crawler que no ejecuta JS y evita
      que la primera pintura sea una página en blanco.
    -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;background:#09090b;color:#fafafa;font-family:'Space Grotesk',system-ui,sans-serif;text-align:center">

          EKI · Diseño y Desarrollo de Software Premium

          <a href="/equipo" style="color:inherit">Equipo</a>
          <a href="/contacto" style="color:inherit">Contacto</a>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
